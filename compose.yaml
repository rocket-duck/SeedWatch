services:
  release-monitor:
    build: .
    container_name: release-monitor
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PROWLARR_URL: ${PROWLARR_URL:-http://host.docker.internal:9696}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY:?Set PROWLARR_API_KEY}
      PROWLARR_DOWNLOAD_CLIENT_ID: ${PROWLARR_DOWNLOAD_CLIENT_ID:-}
      DATABASE_PATH: /data/monitor.db
    volumes:
      - release-monitor-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  release-monitor-data:
